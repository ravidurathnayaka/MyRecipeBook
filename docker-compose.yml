version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recipebook-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipebook}
      POSTGRES_DB: ${POSTGRES_DB:-recipebook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipebook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipebook-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipebook-app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recipebook}:${POSTGRES_PASSWORD:-recipebook}@postgres:5432/${POSTGRES_DB:-recipebook}
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recipebook-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  recipebook-network:
    driver: bridge
